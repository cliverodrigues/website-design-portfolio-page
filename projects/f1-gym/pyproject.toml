[project]
name = "f1-gym"
version = "0.1.0"
description = "F1-style racing environment for Gymnasium"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
